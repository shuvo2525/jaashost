<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login &bull; JAAS BD</title>
  <link rel="icon" type="image/png" href="assets/images/jaasbd-logo.png">
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #170d2f 0%, #070312 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .admin-login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 44px 36px 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .admin-login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #7c3aed 0%, #9333ea 50%, #c084fc 100%);
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .admin-logo {
      height: 46px;
      width: auto;
      object-fit: contain;
      margin-bottom: 14px;
      filter: drop-shadow(0 4px 12px rgba(124, 58, 237, 0.3));
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.4px;
      margin: 0;
    }

    .alert-box {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .alert-danger {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }
    .alert-success {
      background: #faf5ff;
      border: 1px solid #e9d5ff;
      color: #7e22ce;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.prefix-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 14px;
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      height: 48px;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      background: #ffffff;
      border-color: #7c3aed;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .toggle-pass-btn:hover {
      color: #7c3aed;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
      margin-top: 24px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
    }
  </style>
</head>
<body>

  <div class="admin-login-box">
    <div class="login-header">
      <img src="assets/images/jaasbd-logo.png" alt="JAAS BD" class="admin-logo">
      <h1 class="login-title">Log In</h1>
    </div>

    <div id="loginAlert" class="alert-box"></div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label for="adminUsername">Username</label>
        <div class="input-wrapper">
          <i class="fa fa-user prefix-icon"></i>
          <input type="text" id="adminUsername" class="form-control" placeholder="Enter username" required autocomplete="username" autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa fa-lock prefix-icon"></i>
          <input type="password" id="adminPassword" class="form-control" placeholder="Enter password" required autocomplete="current-password">
          <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility()" aria-label="Toggle password visibility">
            <i class="fa fa-eye" id="passEye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        Log In
      </button>
    </form>
  </div>

  <script>
    function togglePassVisibility() {
      const pass = document.getElementById('adminPassword');
      const eye = document.getElementById('passEye');
      if (pass.type === 'password') {
        pass.type = 'text';
        eye.className = 'fa fa-eye-slash';
      } else {
        pass.type = 'password';
        eye.className = 'fa fa-eye';
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('adminUsername').value.trim();
      const pass = document.getElementById('adminPassword').value.trim();
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging in...';

      // 1. Try server API login if server is running
      try {
        const resp = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        if (resp.ok) {
          const res = await resp.json();
          if (res.success) {
            grantAdminAccess(res.username || user);
            return;
          }
        }
      } catch (err) {
        // Fallback to local config validation
      }

      // 2. Validate against local config (stored in localStorage or defaults)
      let validUser = 'admin';
      let validEmail = 'admin@jaasbd.com';
      let validPass = 'admin123';

      const localCfgRaw = localStorage.getItem('jaas_site_config');
      if (localCfgRaw) {
        try {
          const cfg = JSON.parse(localCfgRaw);
          if (cfg.admin) {
            validUser = cfg.admin.username || validUser;
            validEmail = cfg.admin.email || validEmail;
            validPass = cfg.admin.password || validPass;
          }
        } catch (e) {}
      }

      const isMatch = (user.toLowerCase() === validUser.toLowerCase() || user.toLowerCase() === validEmail.toLowerCase()) && (pass === validPass);

      setTimeout(() => {
        if (isMatch) {
          grantAdminAccess(validUser);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Log In';
          alertBox.className = 'alert-box alert-danger';
          alertBox.innerHTML = '<i class="fa fa-exclamation-circle"></i> Invalid username or password.';
          alertBox.style.display = 'block';
        }
      }, 500);
    }

    function grantAdminAccess(username) {
      sessionStorage.setItem('jaas_admin_logged_in', 'true');
      sessionStorage.setItem('jaas_admin_user', username || 'admin');
      localStorage.setItem('jaas_admin_logged_in', 'true');
      localStorage.setItem('jaas_admin_user', username || 'admin');

      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerHTML = '<i class="fa fa-check"></i> Redirecting...';
      alertBox.className = 'alert-box alert-success';
      alertBox.innerHTML = '<i class="fa fa-check-circle"></i> Login successful! Redirecting...';
      alertBox.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 700);
    }
  </script>
</body>
</html>
