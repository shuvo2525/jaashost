<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a9e20"/>
      <stop offset="100%" style="stop-color:#3a6e10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(58,110,16,0.35)"/>
    </filter>
  </defs>
  <!-- Circle background -->
  <circle cx="40" cy="40" r="38" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Envelope body -->
  <rect x="14" y="26" width="52" height="34" rx="4" ry="4" fill="white" opacity="0.95"/>
  <!-- Envelope flap (V shape) -->
  <polyline points="14,26 40,46 66,26" fill="none" stroke="#4a8e18" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bottom fold lines -->
  <line x1="14" y1="60" x2="30" y2="44" stroke="#d4e8c0" stroke-width="2"/>
  <line x1="66" y1="60" x2="50" y2="44" stroke="#d4e8c0" stroke-width="2"/>
  <!-- Small dot accent -->
  <circle cx="40" cy="22" r="3" fill="rgba(255,255,255,0.4)"/>
</svg>
